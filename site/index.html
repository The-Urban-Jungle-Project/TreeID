<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trees | The Urban Jungle Project</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<script src="https://accounts.google.com/gsi/client" async defer onload="window.initGis && initGis()"></script>
</head>
<body>
<header>
  <img src="/assets/tujp-logo.svg" alt="The Urban Jungle Project">
  <div class="eyebrow">Tree register</div>
  <h1>Trees</h1>
</header>
<main id="app"><p class="muted">Loading…</p></main>
<footer id="foot"></footer>
<script src="/config.js"></script>
<script src="/assets/common.js"></script>
<script>
// Home page. Public: short intro. Staff: program a blank NFC tag and open trees by ID.
const canWriteNfc = 'NDEFReader' in window;
const prog = { id: null };

async function home(notice) {
  app.innerHTML = '<p class="muted">Loading…</p>';
  let d = { staff: false };
  if (state.token) {
    try { d = await api('whoami'); } catch (e) { app.innerHTML = msg('Could not reach the tree register. Check your connection.', true); return; }
    if (!d.staff) { saveToken(null); state.token = null; notice = 'Sign-in only works with a TUJP Google account.'; }
  }
  app.innerHTML = (notice ? msg(notice) : '') + (d.staff ? staffHome() : publicHome());
  renderFooter(d.staff ? d.user : null);
  bindHome();
}

function publicHome() {
  return `<div class="card"><p>${esc(CONFIG.PUBLIC_TEXT)}</p>
    <p>Tap the tag on a tree to see its details.</p>
    <a class="btn" href="https://www.theurbanjungleproject.com">About TUJP</a></div>`;
}

function staffHome() {
  return `<div class="card"><h2>Program a new tag</h2>
    ${prog.id ? programmingSteps() : `<p class="muted">Reserves the next free tree ID in the register and puts it on a blank tag.</p>
      <button class="full" id="claimBtn" type="button">Get next free ID</button>`}
  </div>
  <div class="card"><h2>Open a tree</h2>
    <form id="openForm"><label for="openId">Tree ID</label><input id="openId" inputmode="numeric" placeholder="0001-8">
    <button class="secondary full" type="submit">Open</button></form>
  </div>`;
}

function programmingSteps() {
  const url = treeUrl(prog.id);
  const writePart = canWriteNfc
    ? `<p>Hold a blank tag against the back of your phone, then tap Write tag.</p>
       <label class="check"><input type="checkbox" id="lockTag"> Lock the tag permanently (it can never be changed again)</label>
       <button class="full" id="writeBtn" type="button">Write tag</button>`
    : `<ol class="steps">
         <li>Tap Copy link below.</li>
         <li>In the NFC Tools app: Write, Add a record, URL, paste the link, Write, hold the tag to the phone.</li>
         <li>In NFC Tools, set the TUJP tag password (Other, Set password).</li>
       </ol>
       <button class="secondary full" id="copyBtn" type="button">Copy link</button>`;
  return `<p class="muted">Reserved for you:</p><div class="big">${esc(label(prog.id))}</div>
    <p><code>${esc(url)}</code></p>
    <p class="muted">Write ${esc(label(prog.id))} on the tag with a paint marker as well.</p>
    ${writePart}
    <a class="btn full" style="text-align:center;margin-top:16px;display:block" href="/tree/${esc(prog.id)}">Register this tree</a>
    <button class="secondary full" id="nextBtn" type="button">Program another tag</button>`;
}

// Writes the tree link onto the tag. Refuses tags that already belong to another tree.
async function writeTag(url, lock) {
  const ndef = new NDEFReader();
  const ctrl = new AbortController();
  await ndef.scan({ signal: ctrl.signal });
  return new Promise((resolve, reject) => {
    let busy = false;
    const doWrite = async existing => {
      if (busy) return; busy = true;
      try {
        if (existing && existing !== url && /\/tree\/\d{5}/.test(existing)) {
          throw new Error('This tag already belongs to another tree: ' + existing + '. Use a blank tag.');
        }
        await ndef.write({ records: [{ recordType: 'url', data: url }] });
        if (lock) await ndef.makeReadOnly();
        resolve();
      } catch (e) { reject(e); } finally { ctrl.abort(); }
    };
    ndef.onreading = ev => {
      const rec = ev.message.records.find(r => r.recordType === 'url');
      doWrite(rec ? new TextDecoder().decode(rec.data) : null);
    };
    ndef.onreadingerror = () => doWrite(null); // blank, unformatted tags land here
  });
}

function bindHome() {
  const q = s => document.getElementById(s);
  if (q('claimBtn')) q('claimBtn').onclick = e => submitWith(e.target, 'Reserving…', async () => {
    const r = check(await api('claim'));
    prog.id = r.id; home();
  });
  if (q('nextBtn')) q('nextBtn').onclick = () => { prog.id = null; home(); };
  if (q('copyBtn')) q('copyBtn').onclick = async e => {
    try { await navigator.clipboard.writeText(treeUrl(prog.id)); e.target.textContent = 'Link copied'; }
    catch (err) { e.target.textContent = 'Select and copy the link above'; }
  };
  if (q('writeBtn')) q('writeBtn').onclick = e => submitWith(e.target, 'Hold the tag to your phone…', async () => {
    await writeTag(treeUrl(prog.id), q('lockTag').checked);
    e.target.textContent = 'Tag written';
    app.insertAdjacentHTML('afterbegin', msg('Tag written. Tap it to test, then register the tree.'));
  });
  if (q('openForm')) q('openForm').onsubmit = e => {
    e.preventDefault();
    const id = validId(q('openId').value);
    if (id) location.href = '/tree/' + id; else alertBox('That is not a valid tree ID. Check the digits.');
  };
}

state.token = loadToken();
state.onSignIn = () => home();
home();
</script>
</body>
</html>
